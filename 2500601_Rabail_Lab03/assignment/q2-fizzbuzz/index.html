<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FizzFlow</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body>

    <main class="fizz-card">
        <div class="logo">⚡</div>

        <h1>FizzFlow</h1>
        <p>Generate your own FizzBuzz sequence</p>

        <div class="control">
            <input type="number" id="limit" value="30" min="1">
            <button id="generate">Generate</button>
        </div>

        <ul id="fizzList"></ul>
    </main>

</body>
</html>
